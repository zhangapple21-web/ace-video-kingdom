<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 900" role="img" aria-labelledby="title desc">
  <title id="title">残荷诡影封面</title>
  <desc id="desc">月下荷园，残荷与水面映出朦胧的人影</desc>
  <defs>
